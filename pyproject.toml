[project]
name = "access-intake"
version = "0.1.0"
description = "Northstar Labs IT access-request intake: LLM extraction to schema records and a policy-routed review queue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
intake = "access_intake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.databricks.environment]
environment_version = '6'